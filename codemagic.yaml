workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PlateNState_ASC_Key
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.plateandstate.platenstate"
        APP_STORE_APP_ID: 6776563225
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web bundle
        script: NODE_ENV=production npm run build
      - name: Add iOS platform
        script: |
          set -e
          rm -rf ios
          npx cap add ios
          echo "=== After cap add: ios/ tree (depth 2) ==="
          find ios -maxdepth 2 -type d
      - name: Sync Capacitor to iOS
        script: |
          set -e
          npx cap sync ios
          echo "=== After cap sync: searching for Podfile ==="
          find ios -name Podfile -type f
      - name: Install CocoaPods
        script: |
          set -e
          PODFILE_DIR="$(dirname "$(find ios -name Podfile -type f | head -1)")"
          if [ -z "$PODFILE_DIR" ] || [ ! -f "$PODFILE_DIR/Podfile" ]; then
            echo "ERROR: No Podfile found anywhere under ios/"
            find ios -type f | head -50
            exit 1
          fi
          echo "Running pod install in: $PODFILE_DIR"
          cd "$PODFILE_DIR"
          pod install
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files (auto-create if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certs to keychain
        script: keychain add-certificates
      - name: Use profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
