workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PlateNState_ASC_Key
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.plateandstate.platenstate"
        APP_STORE_APP_ID: 6776563225
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web bundle
        script: NODE_ENV=production npm run build
      - name: Add iOS platform
        script: |
          set -e
          rm -rf ios
          npx cap add ios
      - name: Sync Capacitor to iOS
        script: |
          set -e
          npx cap sync ios
          echo "=== iOS project tree ==="
          find ios -maxdepth 4 -type d
      - name: Resolve Swift Package dependencies
        script: |
          set -e
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Initialize keychain
        script: keychain initialize
      - name: Create distribution certificate (with downloadable private key)
        script: |
          set -e
          app-store-connect certificates create \
            --type DISTRIBUTION \
            --save \
            --certificate-key-path /tmp/dist_cert.p12 \
            || app-store-connect certificates list \
                 --type DISTRIBUTION \
                 --save \
                 --certificate-key-path /tmp/dist_cert.p12
      - name: Add cert to keychain
        script: keychain add-certificates
      - name: Create App Store provisioning profile
        script: |
          app-store-connect profiles create \
            --bundle-id-identifier "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-type DISTRIBUTION \
            --save
      - name: Use profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
