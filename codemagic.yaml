workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PlateNState_ASC_Key
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.plateandstate.platenstate"
        APP_STORE_APP_ID: 6776563225
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web bundle
        script: NODE_ENV=production npm run build
      - name: Add iOS platform
        script: |
          set -e
          rm -rf ios
          npx cap add ios
      - name: Sync Capacitor to iOS
        script: |
          set -e
          npx cap sync ios
          echo "=== iOS project tree ==="
          find ios -maxdepth 4 -type d
      - name: Inject privacy usage strings into Info.plist
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          echo "Injecting privacy strings into $PLIST"
          plutil -replace NSCameraUsageDescription -string "Plate N' State uses the camera to scan license plates." "$PLIST"
          plutil -replace NSPhotoLibraryUsageDescription -string "Plate N' State reads photos from your library to scan license plates." "$PLIST"
          plutil -replace NSPhotoLibraryAddUsageDescription -string "Plate N' State saves plate photos to your library." "$PLIST"
          plutil -replace NSLocationWhenInUseUsageDescription -string "Plate N' State uses your location to attach a location to reports." "$PLIST"
          plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "Plate N' State uses your location to attach a location to reports." "$PLIST"
          echo "=== Verifying Info.plist privacy keys ==="
          plutil -p "$PLIST" | grep -i "UsageDescription"
      - name: Resolve Swift Package dependencies (with retry)
        script: |
          set -e
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            if xcodebuild -resolvePackageDependencies \
                 -project "$XCODE_PROJECT" \
                 -scheme "$XCODE_SCHEME"; then
              echo "SPM resolve succeeded on attempt $i"
              break
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "SPM resolve failed (likely transient CDN error). Cleaning and retrying in 30s..."
              rm -rf ~/Library/Developer/Xcode/DerivedData/App-*/SourcePackages
              sleep 30
            else
              echo "SPM resolve failed after $MAX_RETRIES attempts"
              exit 1
            fi
          done
      - name: Initialize keychain
        script: keychain initialize
      - name: Revoke existing distribution certs (free up the slot)
        script: |
          # Delete any existing DISTRIBUTION certs via API so we can create a fresh
          # one whose private key we control. Safe on ephemeral CI: prior certs'
          # keys are gone anyway, and already-uploaded builds stay signed/valid.
          app-store-connect certificates list --type DISTRIBUTION --json > /tmp/certs.json 2>/dev/null || echo "[]" > /tmp/certs.json
          echo "Existing DISTRIBUTION certs:"
          cat /tmp/certs.json
          for id in $(jq -r '.[].id // empty' /tmp/certs.json); do
            echo "Revoking distribution cert $id"
            app-store-connect certificates delete "$id" || true
          done
      - name: Generate private key
        script: |
          set -e
          openssl genrsa -out /tmp/cert_key.pem 2048
      - name: Create fresh distribution certificate using that key
        script: |
          set -e
          app-store-connect certificates create \
            --type DISTRIBUTION \
            --certificate-key @file:/tmp/cert_key.pem \
            --save
      - name: Add cert to keychain
        script: keychain add-certificates
      - name: Fetch signing profile (reuses the cert just created)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
      - name: Use profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST_STORE=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          LATEST=$(( LATEST_STORE > LATEST_TF ? LATEST_STORE : LATEST_TF ))
          NEXT=$(($LATEST + 1))
          echo "Latest build: store=$LATEST_STORE testflight=$LATEST_TF → next=$NEXT"
          agvtool new-version -all $NEXT
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
