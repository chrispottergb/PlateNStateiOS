workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PlateNState_ASC_Key
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.plateandstate.platenstate"
        APP_STORE_APP_ID: 6776563225
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web bundle
        script: NODE_ENV=production npm run build
      - name: Add iOS platform
        script: |
          set -e
          rm -rf ios
          npx cap add ios
      - name: Sync Capacitor to iOS
        script: |
          set -e
          npx cap sync ios
          echo "=== iOS project tree ==="
          find ios -maxdepth 4 -type d
      - name: Generate and inject app icon
        script: |
          set -e
          ICON_SRC="src/assets/logo-icon.png"
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          FLAT="/tmp/icon-flat.png"
          echo "Flattening alpha channel onto #0F172A background"
          pip3 install Pillow -q 2>/dev/null || pip install Pillow -q 2>/dev/null
          python3 << 'PYEOF'
          from PIL import Image
          bg = Image.new("RGB", (1024, 1024), (15, 23, 42))
          icon = Image.open("src/assets/logo-icon.png").convert("RGBA").resize((1024, 1024))
          bg.paste(icon, (0, 0), icon)
          bg.save("/tmp/icon-flat.png")
          print("Flattened icon saved (no alpha)")
          PYEOF
          echo "Generating iOS app icons from flattened source"
          for SIZE in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $SIZE $SIZE "$FLAT" --out "$ICONSET/icon-${SIZE}.png" >/dev/null
          done
          cat > "$ICONSET/Contents.json" << 'ICONJSON'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"icon-40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"icon-60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"icon-58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"icon-87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"icon-80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"icon-120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"icon-120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"icon-180.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"icon-20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"icon-40.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"icon-29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"icon-58.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"icon-40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"icon-80.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"icon-76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"icon-152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"icon-167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"icon-1024.png","scale":"1x"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          ICONJSON
          echo "App icon injected with $(ls $ICONSET/*.png | wc -l) sizes"
      - name: Inject privacy usage strings into Info.plist
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          echo "Injecting privacy strings into $PLIST"
          plutil -replace NSCameraUsageDescription -string "Plate N' State uses the camera to scan license plates." "$PLIST"
          plutil -replace NSPhotoLibraryUsageDescription -string "Plate N' State reads photos from your library to scan license plates." "$PLIST"
          plutil -replace NSPhotoLibraryAddUsageDescription -string "Plate N' State saves plate photos to your library." "$PLIST"
          plutil -replace NSLocationWhenInUseUsageDescription -string "Plate N' State uses your location to attach a location to reports." "$PLIST"
          plutil -replace NSLocationAlwaysAndWhenInUseUsageDescription -string "Plate N' State uses your location to attach a location to reports." "$PLIST"
          plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST"
          echo "=== Verifying Info.plist keys ==="
          plutil -p "$PLIST" | grep -iE "UsageDescription|Encryption"
      - name: Resolve Swift Package dependencies (with retry)
        script: |
          set -e
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            if xcodebuild -resolvePackageDependencies \
                 -project "$XCODE_PROJECT" \
                 -scheme "$XCODE_SCHEME"; then
              echo "SPM resolve succeeded on attempt $i"
              break
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "SPM resolve failed (likely transient CDN error). Cleaning and retrying in 30s..."
              rm -rf ~/Library/Developer/Xcode/DerivedData/App-*/SourcePackages
              sleep 30
            else
              echo "SPM resolve failed after $MAX_RETRIES attempts"
              exit 1
            fi
          done
      - name: Initialize keychain
        script: keychain initialize
      - name: Revoke existing distribution certs (free up the slot)
        script: |
          # Delete any existing DISTRIBUTION certs via API so we can create a fresh
          # one whose private key we control. Safe on ephemeral CI: prior certs'
          # keys are gone anyway, and already-uploaded builds stay signed/valid.
          app-store-connect certificates list --type DISTRIBUTION --json > /tmp/certs.json 2>/dev/null || echo "[]" > /tmp/certs.json
          echo "Existing DISTRIBUTION certs:"
          cat /tmp/certs.json
          for id in $(jq -r '.[].id // empty' /tmp/certs.json); do
            echo "Revoking distribution cert $id"
            app-store-connect certificates delete "$id" || true
          done
      - name: Generate private key
        script: |
          set -e
          openssl genrsa -out /tmp/cert_key.pem 2048
      - name: Create fresh distribution certificate using that key
        script: |
          set -e
          app-store-connect certificates create \
            --type DISTRIBUTION \
            --certificate-key @file:/tmp/cert_key.pem \
            --save
      - name: Add cert to keychain
        script: keychain add-certificates
      - name: Fetch signing profile (reuses the cert just created)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
      - name: Use profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST_STORE=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          LATEST=$(( LATEST_STORE > LATEST_TF ? LATEST_STORE : LATEST_TF ))
          NEXT=$(($LATEST + 1))
          echo "Latest build: store=$LATEST_STORE testflight=$LATEST_TF → next=$NEXT"
          agvtool new-version -all $NEXT
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
